# GRPO training configuration for Alpha-R1 (verl, hydra-style overrides)
# Usage: python -m verl.trainer.main_ppo --config-path training/configs --config-name grpo_alpha_r1
# Model/data paths must be set for your environment before launching.

data:
  train_files: ${oc.env:TRAIN_FILES} # parquet with decision-context prompts
  val_files: ${oc.env:TEST_FILES}
  train_batch_size: 32
  val_batch_size: 23
  max_prompt_length: 32000
  max_response_length: 8000
  filter_overlong_prompts: False
  truncation: right
  shuffle: True
  validation_shuffle: False

actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH} # e.g. Qwen/Qwen3-8B
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    clip_ratio_low: 0.15 # asymmetric clip range (Eq. 11)
    clip_ratio_high: 0.25
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.005
    loss_agg_mode: seq-mean-token-sum-norm
    use_kl_loss: False
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.001
    shuffle: True
    ulysses_sequence_parallel_size: 4
    ppo_mini_batch_size: 32
    ppo_max_token_len_per_gpu: 40100
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: False
      optimizer_offload: False
  ref:
    ulysses_sequence_parallel_size: 4
    log_prob_micro_batch_size_per_gpu: 8
    fsdp_config:
      param_offload: True
  rollout:
    name: vllm
    n: 8 # GRPO group size G
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    val_kwargs:
      temperature: 0
      top_p: 1.0
      top_k: -1
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.7
    enforce_eager: False
    max_num_batched_tokens: 40100
    response_length: 8000
    log_prob_micro_batch_size_per_gpu: 8

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  norm_adv_by_std_in_grpo: True # Eq. 10 advantage normalization

reward_model:
  reward_manager: batch
  reward_kwargs:
    enable_llm_judge: false # stub judge is off by default (Eq. 8-9)

custom_reward_function:
  path: training/reward.py # reference market-feedback reward
  name: compute_score_batch

trainer:
  nnodes: 4
  n_gpus_per_node: 8
  total_epochs: 2
  save_freq: 30
  test_freq: 10
  val_before_train: True
  critic_warmup: 0
  balance_batch: False
  logger: ["console", "wandb"]
