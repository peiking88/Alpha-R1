[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-r1"
version = "0.4.0"
description = "Alpha-R1: Alpha Screening with LLM Reasoning via Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.20",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
qlib = ["pyqlib>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
