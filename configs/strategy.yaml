# End-to-end strategy backtest (paper Section 3.3 + Appendix F execution protocol)
# Used by scripts/train_linear_model.py and scripts/run_strategy_backtest.py

# Universe: "all" (full TDengine universe); benchmark null disables it
market: all
benchmark: null

# Linear-model estimation window (scripts/train_linear_model.py; paper: 2020-2023)
train_start_date: "2020-01-01"
train_end_date: "2023-12-31"

# Backtest window (paper: 12-month 2025 out-of-sample)
start_date: "2025-01-01"
end_date: "2025-12-31"

# Portfolio construction
top_n: 10
holding_days: 5

# Transaction cost per side (0.001 = 10 bps on both buys and sells)
fee: 0.001

# Annual risk-free rate for excess Sharpe and cash interest (4.5% US / 1.5% CN)
risk_free_rate: 0.045

# Limit-lock filter (daily-bar approximation of the paper's rule; off by default
# because daily bars carry no limit-price flags)
reject_limit_locked: false
limit_threshold: 0.098

output_dir: result/strategy_backtest
